baseURL = 'https://blog.cosmic.ovh/'
defaultContentLanguage = 'fr'
title = 'Emmanuel Brache — Cosmic Explorator'
theme = 'aafu'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']
ignoreFiles = ['themes/aafu/content/.*']

[build]
  noJSConfigInAssets = true
  writeStats = true

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML']

[sitemap]
  changefreq = 'monthly'
  priority = 0.5

[params]
  author = 'Emmanuel Brache'
  description = 'Blog d’Emmanuel Brache consacré à l’astronomie, l’astrophotographie, la domotique, Linux et l’auto-hébergement.'
  copyright = '© Emmanuel Brache'
  signature = 'Entre étoiles et lignes de commande.'
  contactFormURL = 'https://docs.google.com/forms/d/e/1FAIpQLScRpqbUgGPKNK0wGAc1pl28Rjs-5v3RQITF1AAH2TRB8cTBIA/viewform'

  [params.theme]
    mainTheme = 'dark'
    showAttribute = false
    singlePage = false

  [[params.accordion]]
    item = 'about_me'
    expand = true

  [[params.accordion]]
    item = 'projects'

  [[params.accordion]]
    item = 'articles'

  [[params.social]]
    icon = 'bi bi-github'
    url = 'https://github.com/CosmicExplorator'
    title = 'GitHub'

[languages]
  [languages.fr]
    locale = 'fr-FR'
    label = 'Français'
    weight = 1

[markup]
  [markup.highlight]
    noClasses = false

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

[caches]
  [caches.images]
    dir = ':cacheDir/images'
