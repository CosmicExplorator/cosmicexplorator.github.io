name: Huawei HiLink SMS
version: "0.1.0"
slug: huawei_hilink_sms
description: Read, send and delete SMS from a Huawei HiLink modem
url: https://github.com/cosmicexplorator/cosmicexplorator.github.io
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:message-text
panel_title: SMS
panel_admin: true
watchdog: http://[HOST]:[PORT:8099]/health
options:
  modem_url: http://192.168.8.1/
  username: ""
  password: ""
  max_messages: 50
schema:
  modem_url: url
  username: str?
  password: password?
  max_messages: "int(1,500)"

