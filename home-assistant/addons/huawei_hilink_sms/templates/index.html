<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Huawei HiLink SMS</title>
    <link rel="stylesheet" href="static/app.css">
  </head>
  <body>
    <header>
      <div>
        <h1>SMS</h1>
        <p>Huawei HiLink</p>
      </div>
      <button id="refresh" class="secondary">Actualiser</button>
    </header>
    <main>
      <form id="send-form">
        <label>Numéro<input id="phone" type="tel" placeholder="+33612345678" required></label>
        <label>Message<textarea id="content" rows="3" maxlength="1600" required></textarea></label>
        <button type="submit">Envoyer</button>
      </form>
      <p id="status" role="status"></p>
      <section id="messages" aria-live="polite"></section>
    </main>
    <template id="message-template">
      <article class="message">
        <div><strong></strong><time></time><p></p></div>
        <button class="delete" title="Supprimer">Supprimer</button>
      </article>
    </template>
    <script src="static/app.js"></script>
  </body>
</html>
