<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Architecture de l’observatoire</title>
  <desc id="desc">La station KStars communique avec le serveur INDI. Le serveur dessert un hub USB relié séparément à la monture EQ6-R, au télescope C8, à la caméra de guidage, au focuser et à AntiDewino.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="1" stop-color="#111d35"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".42"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#38bdf8"/>
    </marker>
    <style>
      .panel{fill:#111c31;stroke:#334155;stroke-width:2}.device{fill:#18243a;stroke:#475569;stroke-width:2}.accent{fill:#0c4a6e;stroke:#38bdf8;stroke-width:2}.title{font:700 25px system-ui,sans-serif;fill:#f8fafc}.subtitle{font:600 16px system-ui,sans-serif;fill:#7dd3fc;letter-spacing:1.5px}.label{font:600 17px system-ui,sans-serif;fill:#e2e8f0}.small{font:14px system-ui,sans-serif;fill:#94a3b8}.wire{fill:none;stroke:#38bdf8;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.power{fill:none;stroke:#fbbf24;stroke-width:4;stroke-linecap:round}.mechanical{fill:none;stroke:#94a3b8;stroke-width:3;stroke-dasharray:9 9}.port{fill:#38bdf8}.badge{fill:#082f49}.badgeText{font:700 13px system-ui,sans-serif;fill:#bae6fd}.metal{fill:#64748b;stroke:#cbd5e1;stroke-width:2}.darkMetal{fill:#263449;stroke:#64748b;stroke-width:2}
    </style>
  </defs>

  <rect width="1400" height="900" rx="28" fill="url(#background)"/>
  <text x="60" y="60" class="title" font-size="31">Architecture physique de l’observatoire</text>
  <text x="60" y="91" class="small">Pilotage réseau, distribution USB et chaîne anti-rosée</text>

  <!-- Station cliente -->
  <g filter="url(#shadow)">
    <rect x="55" y="135" width="310" height="225" rx="18" class="panel"/>
    <text x="85" y="175" class="subtitle">STATION CLIENTE</text>
    <rect x="85" y="198" width="250" height="72" rx="10" class="device"/>
    <rect x="104" y="214" width="78" height="42" rx="4" fill="url(#glass)"/>
    <path d="M112 247l17-17 13 11 14-18 18 24" fill="none" stroke="#e0f2fe" stroke-width="3"/>
    <text x="198" y="228" class="label">KStars / Ekos</text>
    <text x="198" y="250" class="small">pilotage</text>
    <rect x="85" y="290" width="112" height="44" rx="9" class="device"/>
    <text x="105" y="318" class="label">GPS</text>
    <rect x="211" y="290" width="124" height="44" rx="9" class="device"/>
    <text x="230" y="318" class="label">Joystick</text>
  </g>

  <!-- Serveur et hub -->
  <path d="M365 225H490" class="wire" marker-end="url(#arrow)"/>
  <rect x="389" y="199" width="82" height="22" rx="11" class="badge"/>
  <text x="403" y="214" class="badgeText">RÉSEAU</text>
  <path d="M335 312H440V275H490" class="wire" marker-end="url(#arrow)"/>
  <text x="369" y="303" class="small">USB/IP</text>

  <g filter="url(#shadow)">
    <rect x="490" y="135" width="315" height="225" rx="18" class="panel"/>
    <text x="520" y="175" class="subtitle">SERVEUR INDI</text>
    <rect x="520" y="198" width="255" height="75" rx="10" class="device"/>
    <circle cx="548" cy="222" r="6" fill="#4ade80"/>
    <circle cx="548" cy="247" r="6" fill="#38bdf8"/>
    <text x="575" y="228" class="label">Ubuntu 26.04</text>
    <text x="575" y="250" class="small">indiserver</text>
    <path d="M647 273v30" class="wire"/>
    <rect x="520" y="303" width="255" height="40" rx="9" class="accent"/>
    <text x="596" y="329" class="label">HUB USB</text>
    <circle cx="550" cy="343" r="5" class="port"/><circle cx="590" cy="343" r="5" class="port"/><circle cx="630" cy="343" r="5" class="port"/><circle cx="670" cy="343" r="5" class="port"/><circle cx="710" cy="343" r="5" class="port"/><circle cx="750" cy="343" r="5" class="port"/>
  </g>

  <!-- Distribution USB -->
  <path d="M550 348v79H215v80" class="wire"/>
  <path d="M590 348v40H505v102" class="wire"/>
  <path d="M630 348v66H710v78" class="wire"/>
  <path d="M670 348v40H925v96" class="wire"/>
  <path d="M710 348v18h420v132" class="wire"/>
  <path d="M750 348v6h580v380h-185" class="wire"/>
  <g class="badgeText">
    <rect x="234" y="377" width="42" height="22" rx="11" class="badge"/><text x="242" y="392">USB</text>
    <rect x="450" y="400" width="42" height="22" rx="11" class="badge"/><text x="458" y="415">USB</text>
    <rect x="675" y="423" width="42" height="22" rx="11" class="badge"/><text x="683" y="438">USB</text>
    <rect x="880" y="399" width="42" height="22" rx="11" class="badge"/><text x="888" y="414">USB</text>
  </g>

  <!-- Monture -->
  <g filter="url(#shadow)">
    <rect x="55" y="490" width="320" height="345" rx="18" class="panel"/>
    <text x="85" y="530" class="subtitle">MONTURE</text>
    <circle cx="215" cy="595" r="58" class="darkMetal"/>
    <circle cx="215" cy="595" r="24" class="metal"/>
    <path d="M168 558l-35-42M260 560l48-39" stroke="#cbd5e1" stroke-width="18" stroke-linecap="round"/>
    <path d="M215 652v45M215 688l-92 112M215 688l92 112M215 688v112" fill="none" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
    <rect x="112" y="794" width="38" height="10" rx="5" class="metal"/><rect x="196" y="794" width="38" height="10" rx="5" class="metal"/><rect x="280" y="794" width="38" height="10" rx="5" class="metal"/>
    <text x="151" y="745" class="label">EQ6-R Pro</text>
    <text x="132" y="770" class="small">moteurs AD / DEC</text>
  </g>

  <!-- Telescope -->
  <g filter="url(#shadow)">
    <rect x="405" y="490" width="555" height="345" rx="18" class="panel"/>
    <text x="435" y="530" class="subtitle">TÉLESCOPE &amp; IMAGERIE</text>
    <!-- tube C8 -->
    <path d="M505 615l310-62 23 112-310 62z" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
    <path d="M505 615l23 112-28 5-23-112z" fill="#1e3a8a" stroke="#60a5fa" stroke-width="3"/>
    <ellipse cx="826" cy="609" rx="18" ry="57" transform="rotate(-11 826 609)" fill="url(#glass)" stroke="#bae6fd" stroke-width="3"/>
    <text x="620" y="650" font="700 23px system-ui,sans-serif" fill="#0f172a" transform="rotate(-11 620 650)">C8 EdgeHD</text>
    <!-- Canon -->
    <path d="M458 632h45l19 80h-61z" class="darkMetal"/>
    <rect x="425" y="645" width="52" height="48" rx="7" class="device"/>
    <circle cx="452" cy="669" r="14" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <text x="420" y="754" class="small">Canon 1200D</text>
    <!-- Guide scope -->
    <path d="M560 575l205-41 10 45-205 41z" class="darkMetal"/>
    <ellipse cx="770" cy="556" rx="9" ry="23" transform="rotate(-11 770 556)" fill="url(#glass)"/>
    <rect x="527" y="570" width="39" height="36" rx="5" class="device" transform="rotate(-11 547 588)"/>
    <text x="595" y="557" class="small" transform="rotate(-11 595 557)">EvoGuide + ASI120</text>
    <!-- focuser -->
    <rect x="544" y="714" width="118" height="45" rx="9" class="device"/>
    <text x="560" y="742" class="small">Focuser SCT</text>
    <path d="M600 710l35-30" class="mechanical"/>
    <!-- Mechanical link -->
    <path d="M405 686H375" class="mechanical"/>
    <rect x="287" y="673" width="114" height="25" rx="12" fill="#263449"/>
    <text x="299" y="690" class="small">fixation mécanique</text>
  </g>

  <!-- Antidew -->
  <g filter="url(#shadow)">
    <rect x="990" y="490" width="355" height="345" rx="18" class="panel"/>
    <text x="1020" y="530" class="subtitle">ANTI-ROSÉE</text>
    <rect x="1030" y="570" width="275" height="62" rx="11" class="device"/>
    <text x="1065" y="598" class="label">Arduino Uno</text>
    <text x="1065" y="619" class="small">AntiDewino / Firmata</text>
    <path d="M1167 632v45" class="power" marker-end="url(#arrow)"/>
    <text x="1180" y="660" class="small">PWM D9</text>
    <rect x="1030" y="680" width="275" height="62" rx="11" class="device"/>
    <text x="1086" y="718" class="label">Module D4184</text>
    <path d="M1167 742v45" class="power" marker-end="url(#arrow)"/>
    <text x="1180" y="771" class="small">12 V</text>
    <rect x="1030" y="790" width="275" height="25" rx="12" fill="none" stroke="#fbbf24" stroke-width="8"/>
    <text x="1084" y="806" class="small">anneau chauffant</text>
  </g>

  <!-- legend -->
  <path d="M870 865h55" class="wire"/><text x="938" y="871" class="small">USB / réseau</text>
  <path d="M1070 865h55" class="mechanical"/><text x="1138" y="871" class="small">liaison mécanique</text>
  <path d="M1265 865h55" class="power"/><text x="1330" y="871" class="small" text-anchor="end">puissance</text>
</svg>
