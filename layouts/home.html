{{ define "main" }}
<div class="py-8">
  <p class="text-sm uppercase tracking-widest text-blue-500 dark:text-yellow-300">Carnet d’exploration technique</p>
  <h1 class="mt-3">{{ .Title }}</h1>
  <div class="prose dark:prose-invert mb-10">{{ .Content }}</div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    {{ range site.Sections.ByWeight }}
    <a class="block rounded-lg border border-gray-300 dark:border-gray-700 p-5 hover:no-underline hover:bg-gray-100 dark:hover:bg-stone-800" href="{{ .RelPermalink }}">
      <h2 class="text-xl mb-2">{{ .LinkTitle }}</h2>
      <p class="text-stone-600 dark:text-stone-300">{{ .Description | default "Découvrir les articles" }}</p>
      <span class="text-blue-500 dark:text-yellow-300">Explorer →</span>
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
