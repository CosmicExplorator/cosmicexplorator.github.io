    <a class="nav-menu-item" href="{{ site.Home.RelPermalink }}">Accueil</a>
    {{ range site.Sections.ByWeight }}
    <a class="nav-menu-item" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>

</header>
{{ partial "toggleTheme.html" . }}
