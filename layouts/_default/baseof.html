<!doctype html>
<html lang="{{ site.Language.Locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ .Description | default site.Params.description }}">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔭</text></svg>">
  </head>
  <body>
    <input class="nav-toggle" type="checkbox" id="nav-toggle" aria-label="Afficher la navigation">
    <aside class="sidebar">
      <a class="brand" href="{{ site.Home.RelPermalink }}">
        <span class="brand-mark">✦</span>
        <span>Cosmic Explorator</span>
      </a>
      <nav class="nav" aria-label="Navigation principale">
        <a class="nav-home{{ if .IsHome }} active{{ end }}" href="{{ site.Home.RelPermalink }}">Accueil</a>
        {{ range site.Sections.ByWeight }}
          <section class="nav-section">
            <a class="nav-heading{{ if $.IsDescendant . }} active{{ end }}" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
            {{ with .RegularPages.ByWeight }}
              <ul>
                {{ range . }}
                  <li><a{{ if eq $.RelPermalink .RelPermalink }} class="active" aria-current="page"{{ end }} href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
                {{ end }}
              </ul>
            {{ end }}
          </section>
        {{ end }}
      </nav>
      <p class="sidebar-footer">Notes, projets et ciel étoilé.</p>
    </aside>
    <label class="nav-button" for="nav-toggle" aria-hidden="true"><span></span><span></span><span></span></label>
    <label class="backdrop" for="nav-toggle" aria-hidden="true"></label>
    <main class="main">
      <div class="page-shell">
        {{ block "main" . }}{{ end }}
      </div>
    </main>
  </body>
</html>
