{{ define "main" }}
<article class="prose dark:prose-invert m-auto">
  {{ with .CurrentSection }}<a href="{{ .RelPermalink }}">← {{ .LinkTitle }}</a>{{ end }}
  <h1 class="top-h1 mt-4">{{ .Title }}</h1>
  {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
  <div class="content">{{ .Content }}</div>
</article>
{{ if .Store.Get "hasMermaid" }}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  mermaid.initialize({ startOnLoad: true, theme: document.documentElement.classList.contains("dark") ? "dark" : "default" });
</script>
{{ end }}
{{ end }}
